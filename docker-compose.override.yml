services:
  ec-cube:
    platform: linux/amd64
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ".:/var/www/html:cached"
      - "var:/var/www/html/var"
      - "vendor:/var/www/html/vendor"
      - "node_modules:/var/www/html/node_modules"
      - "./dockerbuild/docker-php-entrypoint:/usr/local/bin/docker-php-entrypoint"
    env_file:
      - .env
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      DATABASE_URL: "mysql://dbuser:secret@mysql/eccubedb"
      DATABASE_SERVER_VERSION: "8.0"
      DATABASE_CHARSET: "utf8mb4"
      MAILER_DSN: "smtp://mailcatcher:1025"
      ECCUBE_AUTH_MAGIC: "eccube_custom_auth_magic_secret_431"
      ECCUBE_ADMIN_USER: "admin"
      ECCUBE_ADMIN_PASS: "password"
      ECCUBE_2FA_ENABLED: "false"
      ECCUBE_LOCALE: "${ECCUBE_LOCALE:-en}"

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: secret
    volumes:
      - mysql-database:/var/lib/mysql
      - ./dockerbuild/grant_to_dbuser.sql:/docker-entrypoint-initdb.d/grant_to_dbuser.sql
    ports:
      - "13306:3306"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  mailcatcher:
    platform: linux/amd64

volumes:
  mysql-database:
    driver: local
